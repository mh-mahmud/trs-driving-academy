    <script>
        function password_show_hide() {
            let x = document.getElementById("password");
            let password_eye = document.getElementById("password_eye");
            let show_eye = document.getElementById("show-eye");
            let hide_eye = document.getElementById("hide-eye");
            password_eye.style.marginTop = ".25vw";
            if (screen.width <= 600) {
                password_eye.style.marginTop = ".9vw";
            }

            hide_eye.classList.remove("d-none");
            if (x.type === "password") {
                x.type = "text";
                show_eye.style.display = "none";
                hide_eye.style.display = "block";
            } else {
                x.type = "password";
                show_eye.style.display = "block";
                hide_eye.style.display = "none";
            }
        }

        function password_show_hide2() {
            let x = document.getElementById("password_confirmation");
            let password_eye = document.getElementById("password_eye2");
            let show_eye = document.getElementById("show-eye2");
            let hide_eye = document.getElementById("hide-eye2");
            password_eye.style.marginTop = ".25vw";
            if (screen.width <= 600) {
                password_eye.style.marginTop = ".9vw";
            }

            hide_eye.classList.remove("d-none");
            if (x.type === "password") {
                x.type = "text";
                show_eye.style.display = "none";
                hide_eye.style.display = "block";
            } else {
                x.type = "password";
                show_eye.style.display = "block";
                hide_eye.style.display = "none";
            }
        }

        //sumon modify
        document.addEventListener("DOMContentLoaded", function() {
            // Initial hide/show based on checked status
            toggleInputFields();

            // Listen for changes on radio buttons
            document.querySelectorAll('input[name="documentType"]').forEach((input) => {
                input.addEventListener('change', toggleInputFields);
            });

            function toggleInputFields() {
                // Check which radio button is checked
                const isNidSelected = document.getElementById('nid-radio').checked;

                // Show/hide NID input group
                document.getElementById('nid-group').style.display = isNidSelected ? 'block' : 'none';

                // Show/hide BCT input group
                document.getElementById('bct-group').style.display = isNidSelected ? 'none' : 'block';

                // Update document label
                document.getElementById('document-label').innerHTML = isNidSelected ?
                    'NID Document <span class="text-muted small">(Image/PDF)</span>' :
                    'Birth Certificate Document <span class="text-muted small">(Image/PDF)</span>';
            }
        });
